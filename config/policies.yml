# Product API access required by Cribl Performance Testing.
# App visibility/ACL is controlled by the workspace install, not this file.
policies:
  # Search execution and result polling used by @criblio/app-utils/search.
  - object: '/m/:gid/search/jobs'
    actions: ['GET', 'POST']
  - object: '/m/:gid/search/jobs/*'
    actions: ['GET', 'DELETE']
  # Lakehouse Engine inventory and explicit resize control.
  - object: '/m/:gid/search/local_search/engines'
    actions: ['GET']
  - object: '/m/:gid/search/local_search/engines/*'
    actions: ['PATCH']
  # Dataset catalog, read-only: sorts saved searches into Lakehouse and federated
  # before a run, so each target only times the searches it can affect.
  - object: '/m/:gid/search/datasets'
    actions: ['GET']
